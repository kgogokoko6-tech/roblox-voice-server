<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>تحكم صوت الماب</title>
    <style>
        body {
            font-family: Tahoma, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            text-align: center;
            padding-top: 100px;
        }
        button {
            background-color: #3b82f6;
            color: white;
            border: none;
            padding: 15px 35px;
            font-size: 20px;
            cursor: pointer;
            border-radius: 12px;
            transition: 0.2s;
        }
        button:hover {
            background-color: #2563eb;
        }
        #status {
            margin-top: 25px;
            font-size: 18px;
        }
    </style>
</head>
<body>

    <h1>إدارة ماب بيمش1</h1>
    <p>اضغط للتحكم في ظهور (VoiceWebsiteText) جوة اللعبة:</p>
    
    <button onclick="triggerRoblox()">إظهار النص في الماب</button>
    <div id="status"></div>

    <script>
        async function triggerRoblox() {
            const statusDiv = document.getElementById("status");
            statusDiv.innerText = "جاري إرسال الطلب للسيرفر...";
            statusDiv.style.color = "#fbbf24";

            try {
                const response = await fetch("http://localhost:5000/api/trigger-voice", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    }
                });

                const data = await response.json();

                if (data.success) {
                    statusDiv.innerText = "✅ تم إرسال الإشارة للماب بنجاح!";
                    statusDiv.style.color = "#4ade80";
                } else {
                    statusDiv.innerText = "❌ فشل من السيرفر: " + (data.error || "خطأ غير معروف");
                    statusDiv.style.color = "#f87171";
                }
            } catch (error) {
                statusDiv.innerText = "❌ تعذر الاتصال بالسيرفر الداخلي (تأكد إن node server.js شغال)";
                statusDiv.style.color = "#f87171";
                console.error(error);
            }
        }
    </script>
</body>
</html>
