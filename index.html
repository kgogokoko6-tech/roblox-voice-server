<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>VOICEBLOX</title>

<style>

*{
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    margin:0;
    background:#050505;
    color:white;
}


header{
    height:70px;
    border-bottom:1px solid #222;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:0 40px;
}


.logo{
    font-size:22px;
    font-weight:bold;
}


.online{
    color:#27e889;
    font-size:14px;
}


.container{
    padding:30px;
}


.cards{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:25px;
}


.card{
    background:#111;
    border:1px solid #222;
    border-radius:15px;
    padding:25px;
}


.title{
    color:#aaa;
    margin-bottom:20px;
}


.big{
    font-size:30px;
}


.status{
    color:#27e889;
}


.bar{
    height:8px;
    background:#222;
    border-radius:20px;
    overflow:hidden;
}


.fill{
    height:100%;
    width:100%;
    background:#27e889;
}



.players{
    margin-top:25px;
}



.player{
    background:#151515;
    margin:10px 0;
    padding:18px;
    border-radius:10px;
    display:flex;
    justify-content:space-between;
}


.name{
    font-weight:bold;
}


.distance{
    color:#aaa;
}



@media(max-width:800px){

.cards{
grid-template-columns:1fr;
}

}

</style>

</head>


<body>


<header>

<div class="logo">
🎙️ VOICEBLOX
</div>


<div class="online">
🟢 متصل
</div>

</header>



<div class="container">


<div class="cards">


<div class="card">

<div class="title">
اللاعب
</div>

<div class="big" id="username">
Loading...
</div>

<div class="status">
● متصل
</div>

</div>



<div class="card">

<div class="title">
🎤 الميكروفون
</div>

<div class="big" id="mic">
تشغيل
</div>


<br>


<div class="title">
🔊 مستوى الصوت
</div>


<div class="bar">

<div class="fill" id="volume">
</div>

</div>


<p id="volumeText">
100%
</p>


</div>


</div>



<div class="card players">


<h2>
👥 اللاعبين القريبين
</h2>


<div id="nearby">

لا يوجد لاعبين قريبين

</div>


</div>


</div>




<script>


// ضع UserId اللاعب هنا مؤقتاً
const USER_ID = "12345";


// رابط السيرفر
const API =
"https://roblox-voice-server.kgogokoko6-tech.deno.net";


async function loadPlayer(){

try{


const res =
await fetch(
API+"/api/player/"+USER_ID
);


const data =
await res.json();



if(!data.online){

document.getElementById("username").innerHTML =
"غير متصل";

return;

}



document.getElementById("username").innerHTML =
data.username;



document.getElementById("mic").innerHTML =
data.mic ? "تشغيل 🎤" : "مغلق";


document.getElementById("volume").style.width =
data.volume+"%";


document.getElementById("volumeText").innerHTML =
data.volume+"%";



let box =
document.getElementById("nearby");

box.innerHTML="";



if(data.nearby.length===0){

box.innerHTML =
"لا يوجد لاعبين قريبين";

return;

}



data.nearby.forEach(p=>{


box.innerHTML += `

<div class="player">

<div class="name">
🟢 ${p.username}
</div>


<div class="distance">
📏 ${p.distance} متر
</div>

</div>

`;

});



}catch(e){

console.log(e);

}


}



setInterval(loadPlayer,2000);

loadPlayer();


</script>



</body>

</html>
