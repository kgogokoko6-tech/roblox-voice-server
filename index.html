<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>VoiceBlox Live Bridge</title>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
</head>
<body>
    <h2>اللاعبون المتصلون حالياً في الماب:</h2>
    <ul id="playersList"></ul>

    <script>
        const socket = io();

        -- الاستماع للتحديثات القادمة من روبلوكس عبر السيرفر
        socket.on("positions-updated", (positions) => {
            const list = document.getElementById("playersList");
            list.innerHTML = "";
            positions.forEach(p => {
                const li = document.createElement("li");
                li.textContent = `اللاعب: ${p.username} | الإحداثيات: (${p.x}, ${p.y}, ${p.z})`;
                list.appendChild(li);
            });
        });
    </script>
</body>
</html>
