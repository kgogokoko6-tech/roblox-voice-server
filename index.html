<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>VOICEBLOX Dashboard</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #050607;
        --panel: #101214;
        --panel-2: #171a1d;
        --line: #262b30;
        --text: #f4f7fb;
        --muted: #929ba6;
        --green: #35d39a;
        --blue: #58c7ff;
        --red: #ff6868;
        --amber: #f8bc58;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background:
          linear-gradient(180deg, rgba(255, 255, 255, 0.04), transparent 230px),
          linear-gradient(90deg, rgba(53, 211, 154, 0.035) 1px, transparent 1px),
          linear-gradient(180deg, rgba(88, 199, 255, 0.025) 1px, transparent 1px),
          var(--bg);
        background-size: auto, 52px 52px, 52px 52px, auto;
        color: var(--text);
        font-family: "Segoe UI", Tahoma, Arial, sans-serif;
      }

      .topbar {
        position: sticky;
        top: 0;
        z-index: 5;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 16px clamp(16px, 4vw, 56px);
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        background: rgba(5, 6, 7, 0.88);
        backdrop-filter: blur(16px);
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .logo {
        display: grid;
        place-items: center;
        width: 42px;
        height: 42px;
        border: 1px solid rgba(53, 211, 154, 0.4);
        border-radius: 8px;
        background: rgba(53, 211, 154, 0.12);
        color: var(--green);
        font-weight: 900;
      }

      h1, h2, p {
        margin: 0;
      }

      h1 {
        font-size: 21px;
        line-height: 1.2;
      }

      .subtitle {
        margin-top: 4px;
        color: var(--muted);
        font-size: 13px;
      }

      .status {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        min-height: 36px;
        padding: 0 12px;
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.04);
        color: var(--muted);
        font-weight: 700;
        font-size: 13px;
      }

      .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--amber);
        box-shadow: 0 0 18px currentColor;
      }

      .status.open {
        color: var(--green);
      }

      .status.closed {
        color: var(--red);
      }

      main {
        width: min(1500px, calc(100% - 28px));
        margin: 26px auto 48px;
      }

      .stats {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 14px;
        margin-bottom: 18px;
      }

      .card {
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 8px;
        background: rgba(16, 18, 20, 0.9);
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.34);
      }

      .stat {
        min-height: 86px;
        padding: 16px;
      }

      .label {
        color: var(--muted);
        font-size: 13px;
        font-weight: 700;
      }

      .value {
        display: block;
        margin-top: 10px;
        font-size: 28px;
        line-height: 1;
        font-weight: 900;
      }

      .grid {
        display: grid;
        grid-template-columns: 0.8fr 1.2fr;
        gap: 18px;
      }

      .panel {
        padding: 20px;
      }

      .panel-head {
        display: flex;
        align-items: start;
        justify-content: space-between;
        gap: 14px;
        margin-bottom: 18px;
      }

      h2 {
        font-size: 18px;
      }

      .controls {
        display: grid;
        gap: 18px;
      }

      .range-row {
        display: grid;
        gap: 10px;
      }

      .range-row header {
        display: flex;
        justify-content: space-between;
        color: var(--muted);
        font-size: 13px;
        font-weight: 700;
      }

      input[type="range"] {
        width: 100%;
        accent-color: var(--green);
      }

      .switch {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        min-height: 50px;
        padding: 12px;
        border: 1px solid rgba(255, 255, 255, 0.07);
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.04);
      }

      .switch input {
        width: 44px;
        height: 24px;
        accent-color: var(--green);
      }

      .mic-state {
        margin-top: -8px;
        color: var(--muted);
        font-size: 13px;
        font-weight: 700;
      }

      .mic-state.ok {
        color: var(--green);
      }

      .mic-state.error {
        color: var(--red);
      }

      .players {
        display: grid;
        gap: 10px;
      }

      .player {
        display: grid;
        grid-template-columns: minmax(120px, 0.9fr) minmax(240px, 1.2fr) auto;
        align-items: center;
        gap: 12px;
        min-height: 76px;
        padding: 12px;
        border: 1px solid rgba(255, 255, 255, 0.07);
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.045);
      }

      .player.talking {
        border-color: rgba(53, 211, 154, 0.38);
        background: rgba(53, 211, 154, 0.08);
      }

      .player-id {
        direction: ltr;
        unicode-bidi: isolate;
        font-weight: 900;
      }

      .metrics {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 8px;
      }

      .metric {
        padding: 9px;
        border-radius: 8px;
        background: rgba(0, 0, 0, 0.24);
      }

      .metric span {
        display: block;
        color: var(--muted);
        font-size: 11px;
        font-weight: 700;
      }

      .metric strong {
        display: block;
        margin-top: 5px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-size: 13px;
      }

      .badge {
        display: inline-grid;
        place-items: center;
        min-width: 82px;
        min-height: 32px;
        padding: 0 10px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.07);
        color: var(--muted);
        font-weight: 900;
        font-size: 12px;
      }

      .badge.live {
        background: var(--green);
        color: #04110d;
      }

      .distance-list {
        display: grid;
        gap: 10px;
        margin-top: 18px;
      }

      .distance {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        padding: 12px;
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.045);
        color: var(--muted);
      }

      .distance strong {
        direction: ltr;
        unicode-bidi: isolate;
        color: var(--text);
      }

      .distance b {
        color: var(--green);
      }

      .empty {
        display: grid;
        place-items: center;
        min-height: 150px;
        border: 1px dashed rgba(255, 255, 255, 0.16);
        border-radius: 8px;
        color: var(--muted);
        text-align: center;
      }

      @media (max-width: 1050px) {
        .grid {
          grid-template-columns: 1fr;
        }

        .player {
          grid-template-columns: 1fr;
        }
      }

      @media (max-width: 760px) {
        .topbar {
          align-items: stretch;
          flex-direction: column;
        }

        .stats {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }

        .metrics {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
      }

      @media (max-width: 430px) {
        .stats,
        .metrics {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <div class="logo">VB</div>
        <div>
          <h1>لوحة VOICEBLOX لقرب الصوت</h1>
          <p class="subtitle">Roblox → Deno Deploy → Dashboard</p>
        </div>
      </div>
      <div id="status" class="status">
        <span class="dot"></span>
        <span id="statusText">جاري الاتصال</span>
      </div>
    </header>

    <main>
      <section class="stats">
        <div class="card stat">
          <span class="label">عدد اللاعبين</span>
          <strong class="value" id="playerCount">0</strong>
        </div>
        <div class="card stat">
          <span class="label">يتحدثون الآن</span>
          <strong class="value" id="talkingCount">0</strong>
        </div>
        <div class="card stat">
          <span class="label">داخل نطاق القرب</span>
          <strong class="value" id="nearbyCount">0</strong>
        </div>
        <div class="card stat">
          <span class="label">آخر تحديث</span>
          <strong class="value" id="lastUpdate">--</strong>
        </div>
      </section>

      <section class="grid">
        <aside class="card panel">
          <div class="panel-head">
            <div>
              <h2>إعدادات الصوت</h2>
              <p class="subtitle">تحكم محلي لواجهة المراقبة</p>
            </div>
          </div>

          <div class="controls">
            <div class="range-row">
              <header>
                <span>مستوى الصوت</span>
                <strong id="volumeValue">85%</strong>
              </header>
              <input id="volume" type="range" min="0" max="100" value="85">
            </div>

            <div class="range-row">
              <header>
                <span>حساسية المايك</span>
                <strong id="sensitivityValue">70%</strong>
              </header>
              <input id="sensitivity" type="range" min="0" max="100" value="70">
            </div>

            <label class="switch">
              <span>تشغيل المايكروفون</span>
              <input id="micToggle" type="checkbox" checked>
            </label>
            <p class="mic-state" id="micState">جاري طلب إذن المايك...</p>

            <label class="switch">
              <span>تشغيل السماعات</span>
              <input id="headphonesToggle" type="checkbox" checked>
            </label>
          </div>

          <div class="distance-list" id="distances"></div>
        </aside>

        <section class="card panel">
          <div class="panel-head">
            <div>
              <h2>اللاعبون</h2>
              <p class="subtitle">الموقع، حالة الكلام، وعدد القريبين</p>
            </div>
            <span class="badge" id="radiusBadge">60 studs</span>
          </div>
          <div class="players" id="players"></div>
        </section>
      </section>
    </main>

    <script>
      const state = {
        socket: null,
        micStream: null,
        players: [],
        distances: [],
        nearbyRadius: 60,
        reconnectAttempt: 0,
      };

      const el = {
        status: document.getElementById("status"),
        statusText: document.getElementById("statusText"),
        playerCount: document.getElementById("playerCount"),
        talkingCount: document.getElementById("talkingCount"),
        nearbyCount: document.getElementById("nearbyCount"),
        lastUpdate: document.getElementById("lastUpdate"),
        players: document.getElementById("players"),
        distances: document.getElementById("distances"),
        radiusBadge: document.getElementById("radiusBadge"),
        volume: document.getElementById("volume"),
        volumeValue: document.getElementById("volumeValue"),
        sensitivity: document.getElementById("sensitivity"),
        sensitivityValue: document.getElementById("sensitivityValue"),
        micToggle: document.getElementById("micToggle"),
        micState: document.getElementById("micState"),
        headphonesToggle: document.getElementById("headphonesToggle"),
      };

      const nf = new Intl.NumberFormat("ar-EG", { maximumFractionDigits: 1 });

      connect();
      bindControls();
      startMicrophone();

      function connect() {
        const protocol = location.protocol === "https:" ? "wss:" : "ws:";
        state.socket = new WebSocket(`${protocol}//${location.host}/ws`);
        setStatus("connecting", "جاري الاتصال");

        state.socket.onopen = () => {
          state.reconnectAttempt = 0;
          setStatus("open", "متصل");
        };

        state.socket.onmessage = (event) => {
          const data = JSON.parse(event.data);
          if (data.type === "snapshot") applySnapshot(data);
        };

        state.socket.onclose = () => {
          setStatus("closed", "إعادة الاتصال");
          const delay = Math.min(10000, 700 * 2 ** state.reconnectAttempt);
          state.reconnectAttempt += 1;
          setTimeout(connect, delay);
        };

        state.socket.onerror = () => setStatus("closed", "خطأ اتصال");
      }

      function applySnapshot(data) {
        state.nearbyRadius = Number(data.nearbyRadius) || 60;
        state.players = Array.isArray(data.players) ? data.players : [];
        state.distances = Array.isArray(data.distances) ? data.distances : calculateDistances(state.players, state.nearbyRadius);
        render();
      }

      function calculateDistances(players, radius) {
        const distances = [];
        for (let i = 0; i < players.length; i += 1) {
          for (let j = i + 1; j < players.length; j += 1) {
            const a = players[i];
            const b = players[j];
            const distance = Math.hypot(a.x - b.x, a.y - b.y, a.z - b.z);
            distances.push({
              from: a.id,
              to: b.id,
              distance,
              nearby: distance <= radius,
            });
          }
        }
        return distances.sort((a, b) => a.distance - b.distance);
      }

      function render() {
        const talking = state.players.filter((p) => p.talking).length;
        const nearby = state.players.filter((p) => p.nearbyCount > 0).length;

        el.playerCount.textContent = fmt(state.players.length);
        el.talkingCount.textContent = fmt(talking);
        el.nearbyCount.textContent = fmt(nearby);
        el.lastUpdate.textContent = new Date().toLocaleTimeString("ar-EG");
        el.radiusBadge.textContent = `${fmt(state.nearbyRadius)} studs`;

        renderPlayers();
        renderDistances();
      }

      function renderPlayers() {
        el.players.replaceChildren();

        if (state.players.length === 0) {
          el.players.append(empty("بانتظار بيانات Roblox"));
          return;
        }

        for (const player of state.players) {
          const row = document.createElement("article");
          row.className = `player${player.talking ? " talking" : ""}`;

          row.innerHTML = `
            <div>
              <div class="player-id">${escapeHtml(player.id)}</div>
              <p class="subtitle">${player.talking ? "يتحدث الآن" : "غير متحدث"}</p>
            </div>
            <div class="metrics">
              <div class="metric"><span>X</span><strong>${fmt(player.x)}</strong></div>
              <div class="metric"><span>Y</span><strong>${fmt(player.y)}</strong></div>
              <div class="metric"><span>Z</span><strong>${fmt(player.z)}</strong></div>
              <div class="metric"><span>قريبون</span><strong>${fmt(player.nearbyCount ?? 0)}</strong></div>
            </div>
            <span class="badge ${player.talking ? "live" : ""}">${player.talking ? "Talking" : "Silent"}</span>
          `;

          el.players.append(row);
        }
      }

      function renderDistances() {
        el.distances.replaceChildren();

        if (state.distances.length === 0) {
          el.distances.append(empty("تحتاج لاعبين اثنين لحساب المسافة"));
          return;
        }

        for (const pair of state.distances.slice(0, 8)) {
          const row = document.createElement("div");
          row.className = "distance";
          row.innerHTML = `
            <strong>${escapeHtml(pair.from)} ↔ ${escapeHtml(pair.to)}</strong>
            <b>${fmt(pair.distance)} studs</b>
          `;
          el.distances.append(row);
        }
      }

      function bindControls() {
        el.volume.addEventListener("input", () => {
          el.volumeValue.textContent = `${el.volume.value}%`;
        });

        el.sensitivity.addEventListener("input", () => {
          el.sensitivityValue.textContent = `${el.sensitivity.value}%`;
        });

        el.micToggle.addEventListener("change", () => {
          if (el.micToggle.checked) {
            startMicrophone();
          } else {
            stopMicrophone();
          }
        });
      }

      async function startMicrophone() {
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
          setMicState("error", "المتصفح لا يدعم تشغيل المايك");
          el.micToggle.checked = false;
          return;
        }

        try {
          setMicState("", "جاري طلب إذن المايك...");
          const stream = await navigator.mediaDevices.getUserMedia({
            audio: {
              echoCancellation: true,
              noiseSuppression: true,
              autoGainControl: true,
            },
            video: false,
          });

          stopMicrophone();
          state.micStream = stream;
          el.micToggle.checked = true;
          setMicState("ok", "المايك شغال");
        } catch (error) {
          state.micStream = null;
          el.micToggle.checked = false;
          setMicState("error", "اسمح للمايك من المتصفح ثم اضغط تشغيل المايكروفون");
        }
      }

      function stopMicrophone() {
        if (state.micStream) {
          for (const track of state.micStream.getTracks()) {
            track.stop();
          }
        }

        state.micStream = null;

        if (!el.micToggle.checked) {
          setMicState("", "المايك متوقف");
        }
      }

      function setMicState(className, text) {
        el.micState.className = `mic-state ${className}`.trim();
        el.micState.textContent = text;
      }

      function setStatus(className, text) {
        el.status.className = `status ${className}`;
        el.statusText.textContent = text;
      }

      function empty(text) {
        const div = document.createElement("div");
        div.className = "empty";
        div.textContent = text;
        return div;
      }

      function fmt(value) {
        return nf.format(Number(value) || 0);
      }

      function escapeHtml(value) {
        return String(value).replace(/[&<>"']/g, (char) => ({
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          '"': "&quot;",
          "'": "&#39;",
        }[char]));
      }
    </script>
  </body>
</html>
